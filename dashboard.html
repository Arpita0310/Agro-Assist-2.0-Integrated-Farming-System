<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agro Assist | Ministry Dashboard</title>

<link rel="stylesheet" href="/static/style.css">

<style>

/* ================= GOV HEADER ================= */
header {
  background: linear-gradient(135deg, #1b5e20, #2e7d32);
  color: white;
  padding: 18px 10px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.5px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

header .sub {
  font-size: 12px;
  opacity: 0.85;
  margin-top: 4px;
  font-weight: 400;
}

/* ================= PAGE ================= */
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f5f7f5;
  color: #1a1a1a;
}

/* ================= CONTAINER ================= */
.container {
  max-width: 550px;
  margin: auto;
  padding: 20px;
}

/* ================= CARD ================= */
.card {
  background: #ffffff;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
  border-left: 5px solid #1b5e20;
}

/* ================= LABEL ================= */
label {
  display: block;
  margin-top: 14px;
  font-weight: 600;
  font-size: 13px;
  color: #2b2b2b;
}

/* ================= INPUTS ================= */
select, input {
  width: 100%;
  padding: 11px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #d0d7d0;
  font-size: 14px;
  background: #fff;
}

select:focus, input:focus {
  outline: none;
  border-color: #1b5e20;
}

/* ================= BUTTON ================= */
button {
  width: 100%;
  margin-top: 22px;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #1b5e20;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s ease;
  letter-spacing: 0.3px;
}

button:hover {
  background: #2e7d32;
  transform: translateY(-2px);
}

/* ================= MICRO INFO TAG ================= */
.micro-info {
  font-size: 11px;
  color: #e8f5e9;
  margin-top: 4px;
}

/* ================= FORM SECTION TITLE ================= */
.section-title {
  font-size: 13px;
  font-weight: 700;
  margin-top: 10px;
  color: #1b5e20;
  border-bottom: 1px solid #e0e0e0;
  padding-bottom: 4px;
}

/* ================= GOV NOTE BOX ================= */
.note {
  font-size: 11px;
  color: #666;
  margin-top: 10px;
  line-height: 1.4;
}

</style>

</head>

<body>

<header>
  AGRO-ASSIST 2.0
  <div class="sub">
    Ministry of Agriculture • Decision System
  </div>
</header>

<div class="container">

<form id="farmForm" class="card">

  <div class="section-title">Location Details</div>

  <!-- STATE -->
  <label>State / राज्य / রাজ্য / ਰਾਜ</label>
  <select id="state"></select>

  <!-- DISTRICT -->
  <label>District / जिला / জেলা / ਜ਼ਿਲ੍ਹਾ</label>
  <select id="district"></select>

  <div class="section-title">Farm Configuration</div>

  <!-- BUDGET -->
  <label>Budget / बजट / বাজেট / ਬਜਟ</label>
  <select id="budget">
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
  </select>

  <!-- SEASON -->
  <label>Season / मौसम / মৌসুম / ਮੌਸਮ</label>
  <select id="season">
    <option>Kharif</option>
    <option>Rabi</option>
    <option>Zaid</option>
  </select>

  <!-- LAND INPUT -->
  <label>Land Area (hectares)</label>
  <input type="number" id="landArea" placeholder="Enter land size in hectares" min="0.1" step="0.1">

  <div class="note">
    This system uses ML + climate intelligence + government agricultural data models
    to generate optimized farming plans.
  </div>

  <button type="submit">Generate IFS Plan</button>

</form>

</div>

<script src="/static/script.js"></script>

</body>
</html>
